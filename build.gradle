plugins {
    id 'fabric-loom' version '1.11.8'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'WispForest'
        url = 'https://maven.wispforest.io/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 联动（可选）：Jade 信息提示。插件入口仅 Jade 存在时触发，未装不影响运行
    modImplementation "maven.modrinth:jade:${project.jade_version}"
    // 装配层基石（硬依赖）：Accessories 饰品栏
    modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"
    // Accessories 的 POM 把依赖全部标成 runtime scope，不会传递，需手动声明（版本与其 POM 对齐）
    modImplementation "io.wispforest:owo-lib:0.12.24+1.21.9"
    implementation "io.wispforest:endec:0.1.11"
    implementation "io.wispforest.endec:netty:0.1.5"
    implementation "io.wispforest.endec:gson:0.1.6"
    implementation "io.wispforest.endec:jankson:0.1.6"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
